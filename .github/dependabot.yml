# Dependabot configuration
# Groups routine npm updates into a single weekly PR (instead of one PR per
# package) to cut review noise. Major bumps stay ungrouped so breaking changes
# get individual review. Also keeps GitHub Actions pinned versions current.
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # One combined PR for all minor/patch npm updates (security and version).
      npm-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"
    ignore:
      # TypeScript stays on 5.x: the root type-checks with vue-tsc, which wraps
      # the TS compiler API and isn't ready for the TS 7 native (Go) compiler
      # (the root bump was closed in #71). The worker is held to the same major
      # below so the repo crosses to 7 together, once vue-tsc supports it.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "npm"
    directory: "/worker"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      worker-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      worker-security:
        applies-to: security-updates
        patterns:
          - "*"
    ignore:
      # Keep the worker's TypeScript on the root's major (5.x). It floated to 7
      # once (#234) and was deliberately re-pinned (#400) because a diverged
      # /worker npm ci pulled a native compiler the root never uses.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
