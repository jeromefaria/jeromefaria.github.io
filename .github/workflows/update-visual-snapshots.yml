name: Update Visual Snapshots

# Manually dispatched to (re)generate the platform-specific visual-regression
# baselines in the CI (Linux) environment. Download the resulting artifact and
# commit it to e2e/. Run this whenever an intentional visual change lands.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Regenerate visual baselines
        run: npx playwright test --grep @visual --update-snapshots

      - name: Upload baselines
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: visual-snapshots
          path: e2e/**/*-snapshots/**
          retention-days: 1
