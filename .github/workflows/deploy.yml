name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Run the full CI pipeline (quality checks, build, Lighthouse, cross-browser
  # E2E) as the deploy gate — the exact workflow that runs on pull requests, so
  # the checks are defined in a single place.
  checks:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  build-pages:
    needs: checks
    runs-on: ubuntu-24.04
    steps:
      # Reuse the exact dist the E2E gate exercised — no rebuild, so what ships
      # is what was tested — then overlay the downloads (résumé/EPK PDFs, OG
      # images) rendered in parallel, the same overlay the E2E job applies,
      # mapped from public/ onto dist root exactly as the build would have.
      - name: Download build artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dist
          path: dist/

      - name: Download generated downloads
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: downloads
          path: downloads/

      - name: Overlay generated downloads onto dist
        run: tar -xzf downloads/downloads.tar.gz -C dist

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build-pages
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
