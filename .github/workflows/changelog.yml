name: Changelog

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: changelog-${{ github.ref }}
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PUSH_TOKEN: ${{ secrets.CHANGELOG_PUSH_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.CHANGELOG_PUSH_TOKEN || github.token }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Regenerate and commit if changed
        run: |
          if [ -z "$PUSH_TOKEN" ]; then
            echo "CHANGELOG_PUSH_TOKEN not set — skipping auto-commit. Add the secret to enable it."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch --quiet --tags origin master
            git reset --quiet --hard origin/master
            npm run changelog
            if git diff --quiet -- CHANGELOG.md; then
              echo "CHANGELOG.md already current — nothing to commit."
              exit 0
            fi
            git add CHANGELOG.md
            git commit --no-verify -m "chore(changelog): regenerate CHANGELOG.md [skip ci]"
            if git push; then
              exit 0
            fi
            echo "Push lost the race on attempt ${attempt}; regenerating against the new master."
          done
          echo "Changelog could not be pushed after 3 attempts." >&2
          exit 1
