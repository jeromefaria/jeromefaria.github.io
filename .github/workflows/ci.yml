name: CI

on:
  pull_request:
  # On master, this pipeline runs as the deploy workflow's gate (workflow_call)
  # rather than standalone, so the checks execute exactly once per push.
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: the jobs only read the repo (checkout). Coverage upload and
# Lighthouse use their own dedicated tokens, not GITHUB_TOKEN.
permissions:
  contents: read

jobs:
  quality-checks:
    name: Quality Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Type check E2E specs
        run: npx tsc -p e2e/tsconfig.json --noEmit

      - name: Lint
        run: npm run lint

      - name: Run unit tests with coverage
        run: npm run test:coverage

      - name: Check coverage thresholds
        run: node scripts/checks/check-coverage.js

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          files: ./coverage/coverage-final.json
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Generate downloadable PDFs
        run: npm run downloads:build

      - name: Build production bundle
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dist
          path: dist/
          retention-days: 7

      - name: Check bundle size
        run: |
          echo "📦 Checking bundle sizes (per-file)..."
          over_budget=0

          check() {
            local pattern="$1" limit_kb="$2" mode="${3:-raw}"
            for file in $pattern; do
              [ -f "$file" ] || continue
              local bytes
              if [ "$mode" = "gzip" ]; then
                bytes=$(gzip -c "$file" | wc -c)
              else
                bytes=$(wc -c < "$file")
              fi
              local size_kb=$(( bytes / 1024 ))
              echo "  $(basename "$file"): ${size_kb}KB ${mode} (budget ${limit_kb}KB)"
              if [ "$size_kb" -gt "$limit_kb" ]; then
                echo "❌ $(basename "$file") exceeds ${limit_kb}KB ${mode}"
                over_budget=1
              fi
            done
          }

          check 'dist/assets/*.js' 200
          check 'dist/assets/*.css' 12 gzip

          if [ "$over_budget" -ne 0 ]; then
            echo "Bundle size budget exceeded."
            exit 1
          fi
          echo "✅ All bundles within budget."

  # Desktop and mobile run as parallel matrix legs rather than back-to-back in
  # one job, so Lighthouse's wall-clock is one profile's runtime, not both.
  # Assertions are enforced (no continue-on-error): the deterministic quality
  # gates (accessibility, best-practices, no console errors, JS/CSS resource
  # sizes, text compression) block CI. Performance timings and content-driven
  # image weight are advisory (warn). Mobile (Moto G4 + slow 4G) keeps its CWV
  # assertions advisory so a variable runner never hard-fails on mobile timings.
  lighthouse-matrix:
    name: Lighthouse (${{ matrix.profile }})
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: desktop
            script: lighthouse
          - profile: mobile
            script: lighthouse:mobile

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dist
          path: dist/

      - name: Run Lighthouse CI (${{ matrix.profile }})
        run: npm run ${{ matrix.script }}
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

      - name: Upload Lighthouse reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: lighthouse-reports-${{ matrix.profile }}
          path: .lighthouseci/
          retention-days: 30

  # Branch protection requires a check named exactly "Lighthouse". The audit now
  # runs as a parallel desktop/mobile matrix (checks "Lighthouse (desktop)" and
  # "Lighthouse (mobile)"), so this thin job republishes their aggregate result
  # under the required name without re-running any audit.
  lighthouse:
    name: Lighthouse
    runs-on: ubuntu-latest
    needs: lighthouse-matrix
    if: always()

    steps:
      - name: Gate on the Lighthouse matrix result
        run: |
          if [ "${{ needs.lighthouse-matrix.result }}" != "success" ]; then
            echo "Lighthouse matrix did not pass (result: ${{ needs.lighthouse-matrix.result }})."
            exit 1
          fi
          echo "Lighthouse matrix passed."

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps ${{ matrix.project }}

      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dist
          path: dist/

      - name: Run Playwright tests
        run: npx playwright test --project=${{ matrix.project }} --grep-invert @visual

      - name: Upload Playwright report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: playwright-report-${{ matrix.project }}
          path: |
            playwright-report/
            test-results/
          retention-days: 30

  # Visual-regression snapshots. Runs on pull requests only (skipped when this
  # workflow is called by the deploy pipeline), so a pixel diff surfaces on the
  # PR without ever blocking a deploy. Baselines live in e2e/*-snapshots/.
  visual-tests:
    name: Visual Regression
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request'
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dist
          path: dist/

      - name: Run visual snapshots
        run: npx playwright test --grep @visual

      - name: Upload visual diff report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: visual-report
          path: |
            playwright-report/
            test-results/
          retention-days: 30

  worker:
    name: Worker
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: worker

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: worker/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Run unit tests with coverage
        run: npm run test:coverage

  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [quality-checks, build, lighthouse, e2e-tests, visual-tests, worker]
    if: always()

    steps:
      - name: Check job statuses
        run: |
          echo "## CI Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Quality Checks | ${{ needs.quality-checks.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build | ${{ needs.build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Lighthouse | ${{ needs.lighthouse.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| E2E Tests | ${{ needs.e2e-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Visual Regression | ${{ needs.visual-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Worker | ${{ needs.worker.result }} |" >> $GITHUB_STEP_SUMMARY

          # Fail if any job failed. Visual Regression is PR-only, so "skipped"
          # (the deploy path) is acceptable — only a real failure blocks.
          if [ "${{ needs.quality-checks.result }}" != "success" ] || \
             [ "${{ needs.build.result }}" != "success" ] || \
             [ "${{ needs.lighthouse.result }}" != "success" ] || \
             [ "${{ needs.e2e-tests.result }}" != "success" ] || \
             [ "${{ needs.worker.result }}" != "success" ] || \
             { [ "${{ needs.visual-tests.result }}" != "success" ] && \
               [ "${{ needs.visual-tests.result }}" != "skipped" ]; }; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "❌ **CI Pipeline Failed**" >> $GITHUB_STEP_SUMMARY
            exit 1
          else
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "✅ **All Checks Passed**" >> $GITHUB_STEP_SUMMARY
          fi
