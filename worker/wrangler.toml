name = "contact"
main = "src/index.ts"
compatibility_date = "2026-08-01"

[vars]
CONTACT_FROM = "contact@jeromefaria.com"
CONTACT_TO = "jerome.faria@gmail.com"
# Production origins only. Local dev adds http://localhost:5173 via .dev.vars
# (gitignored) so a Turnstile token minted on localhost can't pass the prod hostname pin.
ALLOWED_ORIGINS = "https://jeromefaria.com"

# Secrets (set with `wrangler secret put`, never committed):
#   TURNSTILE_SECRET   — Cloudflare Turnstile secret key
#   RESEND_API_KEY     — Resend API key

# Rate limiting — native binding, no external resource to provision.
# 5 requests per 60s per client IP; the Worker fails open if this is absent.
[[unsafe.bindings]]
name = "RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 5, period = 60 }
