name = "contact"
main = "src/index.ts"
compatibility_date = "2026-08-01"

[vars]
CONTACT_FROM = "Jerome Faria <contact@jeromefaria.com>"
CONTACT_TO = "jerome.faria@gmail.com"
NEWSLETTER_FROM = "Jerome Faria <newsletter@jeromefaria.com>"
SITE_URL = "https://jeromefaria.com"
# keep: prod origins only; dev adds localhost via gitignored .dev.vars so a localhost Turnstile token can't pass the prod hostname pin
ALLOWED_ORIGINS = "https://jeromefaria.com"

[[d1_databases]]
binding = "DB"
database_name = "newsletter"
database_id = "81db08d3-ebf6-4eaf-908b-ec6de0d6e82f"

# keep: native rate limiter, 5 requests per 60s per IP; the Worker fails open if this binding is absent
[[unsafe.bindings]]
name = "RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 5, period = 60 }
