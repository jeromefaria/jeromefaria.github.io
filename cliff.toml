# git-cliff configuration — repo-facing changelog, generated from the Vue 3 rewrite forward.
# Regenerate with `npm run changelog` (bounds the range to the Vue-app genesis).

[changelog]
header = """
# Changelog

All notable changes since the Vue 3 rewrite. Versioned by CalVer (`YYYY.0M.patch`).
"""
body = """
{% if version %}
## {{ version }}{% if message %} — {{ message }}{% endif %}{% if timestamp %} — {{ timestamp | date(format="%Y-%m-%d") }}{% endif %}
{% else %}
## Unreleased
{% endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | split(pat="-->") | last | trim }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | split(pat="\n") | first | trim | upper_first }}
{%- endfor %}
{% endfor %}
"""
footer = """
_Genesis: migration from Jekyll to a typed Vue 3 SPA (2025-12-07)._
"""
trim = true
postprocessors = [
  # GitHub only autolinks #N inside issues/PRs, not in repo markdown files, so link them here.
  { pattern = '\(#(\d+)\)', replace = "([#${1}](https://github.com/jeromefaria/jeromefaria.github.io/pull/${1}))" },
]

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
protect_breaking_commits = false
filter_commits = false
topo_order = false
sort_commits = "newest"
tag_pattern = "[0-9]{4}\\.[0-9]{2}\\.[0-9]+"

commit_parsers = [
  # The auto-regeneration workflow's own commits are bookkeeping, not history — drop them.
  { message = "^chore\\(changelog\\): regenerate", skip = true },
  # Conventional types (matched on the raw "type(scope): …"; the type prefix is stripped for display).
  { message = "^feat", group = "<!-- 01 -->Features" },
  { message = "^content", group = "<!-- 02 -->Content" },
  { message = "^data", group = "<!-- 02 -->Content" },
  { message = "^fix", group = "<!-- 03 -->Fixes" },
  { message = "^perf", group = "<!-- 04 -->Performance" },
  { message = "^refactor", group = "<!-- 05 -->Refactors" },
  { message = "^test", group = "<!-- 06 -->Tests" },
  { message = "^build|^ci", group = "<!-- 07 -->Build & CI" },
  { message = "^docs", group = "<!-- 08 -->Docs" },
  { message = "^style", group = "<!-- 09 -->Style" },
  { message = "^chore", group = "<!-- 10 -->Chores" },
  { message = "^revert", group = "<!-- 11 -->Reverts" },
  # Legacy Title-Case imperative subjects from before the convention was enforced.
  { message = "^(Add|Introduce|Implement|Create|Enable|Support|Wire|Build|Generate|Make|Expand|Show|Serve|Give|Surface|Fill|Extend|Expose|Enlarge|Instrument|Route)\\b", group = "<!-- 01 -->Features" },
  { message = "^(Fix|Correct|Repair|Resolve|Prevent|Restore|Handle|Hide|Close|Stop|Guard|Avoid|Patch|Re-gate)\\b", group = "<!-- 03 -->Fixes" },
  { message = "^(Optimize|Optimise|Improve|Speed|Reduce|Compress|Increase|Subset|Shrink)\\b", group = "<!-- 04 -->Performance" },
  { message = "^(Refactor|Extract|Rename|Move|Simplify|Consolidate|Reorganize|Reorganise|Restructure|Normalize|Normalise|Split|Replace|Sort|Reorder|Remove|Delete|Drop|Strip|Deduplicate|Tidy|Clean|Model|Migrate|Standardize|Standardise|Modernise|Scope|Trim|Tighten|Use|Backfill|Apply|Unify|Collapse|Decouple|Lift|Promote|Refine)\\b", group = "<!-- 05 -->Refactors" },
  { message = "^(Test|Cover)\\b", group = "<!-- 06 -->Tests" },
  { message = "^(Docs?|Document)\\b", group = "<!-- 08 -->Docs" },
  { message = "^(Style|Polish|Format|Align|Tweak|Restyle|Fluid)\\b", group = "<!-- 09 -->Style" },
  { message = "^(Update|Bump|Upgrade|Configure|Set|Run|Adopt|Pin|Enforce|Ignore|Finalise|Finalize|Lint|Go)\\b", group = "<!-- 10 -->Chores" },
  { message = "^(Translate|Revise|Curate|Reconcile|Weave|Refresh|Point|Link|Enrich|Localize|Localise|Reword|Rephrase|Contact)\\b", group = "<!-- 02 -->Content" },
  { message = ".*", group = "<!-- 12 -->Other" },
]
