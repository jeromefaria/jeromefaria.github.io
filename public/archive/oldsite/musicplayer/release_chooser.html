<html><head>
<meta name="viewport" content="width=690">
<link rel="stylesheet" href="/archive/_scale.css">
<meta name="robots" content="noindex"><title>Release Chooser</title><meta http-equiv="Content-Type" content="text/html; charset=iso-8859-1"><link href="../nny.css" rel="stylesheet" type="text/css"><script>	function boo(){		alert('boo');	}	function change_release(val){				if (val=='offear'){			parent.mainFrame.location.href='http://nothing.scene.org/nny/musicplayer/player_offear.html';			document.release_chooser_form.release.value = val;			}			if(val == 'readerror'){			parent.mainFrame.location.href='http://nothing.scene.org/nny/musicplayer/player_readerror.html';				document.release_chooser_form.release.value = val;			}		if(val =='ect'){			parent.mainFrame.location.href='http://nothing.scene.org/nny/musicplayer/player_ect.html';				document.release_chooser_form.release.value = val;			}		if(val =='coil'){			parent.mainFrame.location.href='http://nothing.scene.org/nny/musicplayer/player_coil.html';				document.release_chooser_form.release.value = val;			}	}</script></head><body class="text" bgcolor="#e6e6e6"><form name="release_chooser_form"><span class="text">&nbsp;Release:</span> 	<select class="text" name="release" onChange="change_release(this.value)">	  <option value="offear">OFFEAR.EP (2004)</option>	  <option value="readerror">(READ.ERROR) (2005)</option>	  <option value="ect">ECT (2005)</option>	  <option value="coil">COIL (2006)</option>    </select></form><br></body></html>
